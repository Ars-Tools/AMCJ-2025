<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0f172a" />
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Hann Window &amp; COLA Constraint</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Why 50% Overlap results in a perfectly flat amplitude response.</text-->

    <!-- ============================================================================================== -->
    <!-- 1. INDIVIDUAL WINDOWS -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 150)">
        <text x="0" y="-30" fill="#38bdf8" font-size="16" font-weight="bold">1. Individual Hann Windows</text>
        <text x="250" y="-30" fill="#94a3b8" font-size="12">Shifted by 50% of window length (Hop Size = N/2)</text>

        <!-- Axis -->
        <line x1="0" y1="100" x2="720" y2="100" stroke="#475569" stroke-width="1"/>
        
        <!-- Window 1 (Cyan) -->
        <!-- Hann Shape: sin^2(x) from 0 to pi -->
        <path d="M 0 100 C 50 100, 50 0, 100 0 C 150 0, 150 100, 200 100" 
              fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="100" y="-10" fill="#38bdf8" font-size="12" text-anchor="middle">Window 1</text>

        <!-- Window 2 (Orange) - Shifted by 100px (50%) -->
        <!-- Center at 200. Start 100, End 300. -->
        <path d="M 100 100 C 150 100, 150 0, 200 0 C 250 0, 250 100, 300 100" 
              fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="200" y="-10" fill="#f59e0b" font-size="12" text-anchor="middle">Window 2</text>

        <!-- Window 3 (Pink) - Shifted by another 100px -->
        <!-- Center at 300. Start 200, End 400. -->
        <path d="M 200 100 C 250 100, 250 0, 300 0 C 350 0, 350 100, 400 100" 
              fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="300" y="-10" fill="#e879f9" font-size="12" text-anchor="middle">Window 3</text>
        
        <!-- Window 4 (Green) - Shifted by another 100px -->
        <path d="M 300 100 C 350 100, 350 0, 400 0 C 450 0, 450 100, 500 100" 
              fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="400" y="-10" fill="#22c55e" font-size="12" text-anchor="middle">Window 4</text>

        <!-- Overlap Markers -->
        <line x1="100" y1="100" x2="100" y2="120" stroke="#64748b" stroke-width="1"/>
        <line x1="200" y1="100" x2="200" y2="120" stroke="#64748b" stroke-width="1"/>
        
        <path d="M 100 115 L 200 115" stroke="#f1f5f9" stroke-width="1" marker-end="url(#arrowhead)"/>
        <text x="150" y="130" fill="#f1f5f9" font-size="12" text-anchor="middle">Hop Size (50%)</text>
    </g>


    <!-- ============================================================================================== -->
    <!-- 2. SUMMATION (The Magic) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 350)">
        <text x="0" y="-30" fill="#22c55e" font-size="16" font-weight="bold">2. Summed Output (Overlap-Add)</text>
        <text x="300" y="-30" fill="#94a3b8" font-size="12">Complementary curves sum to a constant value.</text>

        <!-- Axis -->
        <line x1="0" y1="50" x2="720" y2="50" stroke="#475569" stroke-width="1"/> <!-- y=0 -->
        <line x1="0" y1="-50" x2="720" y2="-50" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/> <!-- y=1 (Target) -->
        <text x="-10" y="-45" fill="#f1f5f9" font-size="10" text-anchor="end">Amp = 1.0</text>

        <!-- Sum Line (Thick Green) -->
        <!-- From 100 to 400 (where full overlap occurs), the sum is exactly flat -->
        <path d="M 0 50 L 100 -50 L 400 -50 L 500 50" stroke="#22c55e" stroke-width="4" fill="none" filter="url(#glow)"/>
        
        <!-- Ghost lines of components to show *why* -->
        <!-- Segment 1-2 intersection -->
        <g opacity="0.3">
            <path d="M 100 50 C 150 50, 150 -50, 200 -50" stroke="#38bdf8" stroke-width="2" fill="none"/> <!-- Falling edge W1 -->
            <path d="M 100 50 C 150 50, 150 -50, 200 -50" stroke="#f59e0b" stroke-width="2" fill="none" transform="scale(-1, 1) translate(-300, 0)"/> <!-- Rising edge W2 -->
        </g>
        
        <!-- Annotation Arrow -->
        <path d="M 250 -60 L 250 -80" stroke="#22c55e" stroke-width="2"/>
        <text x="250" y="-90" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">Constant Amplitude</text>
        <text x="250" y="-75" fill="#94a3b8" font-size="10" text-anchor="middle">(No Modulation)</text>

    </g>

</svg>
