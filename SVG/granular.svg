<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
        </marker>
        <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Grain Window Shape (Bell curve) -->
        <path id="grainWindow" d="M 0 40 Q 25 0, 50 40" fill="none" stroke-width="2"/>
    </defs>

    <!-- Background -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Main Title -->
    <!--text x="40" y="40" fill="#e879f9" font-size="24" font-weight="bold">Application: Granular Synthesis</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Generating smooth textures from random grains using Phase Feedback.</text-->


    <!-- ============================================================================================== -->
    <!-- STAGE 1: SOURCE BUFFER & GRAIN EXTRACTION -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 100)">
        <text x="0" y="-10" fill="#38bdf8" font-size="14" font-weight="bold">1. Source Buffer (Grain Selection)</text>
        <text x="250" y="-10" fill="#94a3b8" font-size="12">Grains are extracted from random positions (Pos).</text>

        <!-- Timeline Axis -->
        <line x1="0" y1="40" x2="700" y2="40" stroke="#475569" stroke-width="1"/>
        <text x="680" y="60" fill="#64748b" font-size="10">Source Time</text>

        <!-- Long Input Waveform -->
        <path d="M 0 40 Q 20 10, 40 40 T 80 40 T 120 40 T 160 40 T 200 40 T 240 40 T 280 40 
                 T 320 40 T 360 40 T 400 40 T 440 40 T 480 40 T 520 40 T 560 40 T 600 40 
                 T 640 40 T 680 40" 
              fill="none" stroke="#334155" stroke-width="1"/>

        <!-- GRAIN 1 (Cyan) -->
        <g transform="translate(100, 0)">
            <use href="#grainWindow" stroke="#38bdf8"/>
            <text x="25" y="-5" fill="#38bdf8" font-size="10" text-anchor="middle">Grain 1</text>
            <line x1="25" y1="40" x2="25" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
            <text x="25" y="70" fill="#38bdf8" font-size="10" text-anchor="middle">Pos A</text>
        </g>

        <!-- GRAIN 2 (Pink) - Far away -->
        <g transform="translate(500, 0)">
            <use href="#grainWindow" stroke="#e879f9"/>
            <text x="25" y="-5" fill="#e879f9" font-size="10" text-anchor="middle">Grain 2</text>
            <line x1="25" y1="40" x2="25" y2="60" stroke="#e879f9" stroke-width="1" stroke-dasharray="2 2"/>
            <text x="25" y="70" fill="#e879f9" font-size="10" text-anchor="middle">Pos B</text>
        </g>

        <!-- GRAIN 3 (Green) - Another random spot -->
        <g transform="translate(300, 0)">
            <use href="#grainWindow" stroke="#22c55e"/>
            <text x="25" y="-5" fill="#22c55e" font-size="10" text-anchor="middle">Grain 3</text>
            <line x1="25" y1="40" x2="25" y2="60" stroke="#22c55e" stroke-width="1" stroke-dasharray="2 2"/>
            <text x="25" y="70" fill="#22c55e" font-size="10" text-anchor="middle">Pos C</text>
        </g>
    </g>

    <!-- Downward Arrows -->
    <path d="M 165 180 L 165 210" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 565 180 L 565 210" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 365 180 L 365 210" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>


    <!-- ============================================================================================== -->
    <!-- STAGE 2: PROCESSING (The Secret Sauce) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 220)">
        <rect x="0" y="0" width="700" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="bold">2. Phase Rectification Logic</text>
        <text x="250" y="30" fill="#94a3b8" font-size="12">Discard input phase, Apply coherent phase.</text>

        <!-- Processing Node 1 -->
        <g transform="translate(100, 50)">
            <!-- Amplitude -->
            <rect x="0" y="0" width="50" height="40" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1"/>
            <text x="25" y="25" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">|G1|</text>
            <text x="25" y="55" fill="#94a3b8" font-size="8" text-anchor="middle">Amp</text>
            
            <!-- Phase -->
            <rect x="0" y="60" width="50" height="40" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
            <text x="25" y="85" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">φ</text>
            <text x="25" y="115" fill="#94a3b8" font-size="8" text-anchor="middle">Phase</text>
        </g>

        <!-- Processing Node 2 -->
        <g transform="translate(300, 50)">
             <rect x="0" y="0" width="50" height="40" rx="4" fill="#334155" stroke="#22c55e" stroke-width="1"/>
            <text x="25" y="25" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle">|G2|</text>
             <rect x="0" y="60" width="50" height="40" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
            <text x="25" y="85" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">φ</text>
        </g>

        <!-- Processing Node 3 -->
        <g transform="translate(500, 50)">
             <rect x="0" y="0" width="50" height="40" rx="4" fill="#334155" stroke="#e879f9" stroke-width="1"/>
            <text x="25" y="25" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">|G3|</text>
             <rect x="0" y="60" width="50" height="40" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
            <text x="25" y="85" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">φ</text>
        </g>

        <!-- Phase Feedback Arrows -->
        <!-- From Output 1 to Node 2 -->
        <path d="M 150 80 L 280 80" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
        <!-- From Output 2 to Node 3 -->
        <path d="M 350 80 L 480 80" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
        
        <text x="220" y="70" fill="#f59e0b" font-size="10" text-anchor="middle">Feedback</text>
        <text x="420" y="70" fill="#f59e0b" font-size="10" text-anchor="middle">Feedback</text>

        <!-- Initial Phase -->
        <text x="60" y="85" fill="#64748b" font-size="10" text-anchor="end">Start →</text>
    </g>

    <!-- Downward Arrows -->
    <path d="M 165 370 L 165 410" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 365 370 L 365 410" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 565 370 L 565 410" stroke="#64748b" stroke-width="1" marker-end="url(#arrowhead)"/>


    <!-- ============================================================================================== -->
    <!-- STAGE 3: OUTPUT GRANULAR STREAM -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 420)">
        <text x="0" y="-10" fill="#22c55e" font-size="14" font-weight="bold">3. Granular Stream (Texture)</text>
        <text x="300" y="-10" fill="#94a3b8" font-size="12">Grains overlap smoothly to form a continuous soundscape.</text>

        <!-- Timeline Axis -->
        <line x1="0" y1="50" x2="700" y2="50" stroke="#475569" stroke-width="1"/>
        
        <!-- Overlapping Grains -->
        <!-- Grain 1 Placed -->
        <g transform="translate(100, 10)">
            <use href="#grainWindow" stroke="#38bdf8" fill="#38bdf8" fill-opacity="0.1"/>
            <path d="M 0 40 Q 25 20, 50 40" fill="none" stroke="#38bdf8" stroke-width="2"/>
        </g>
        
        <!-- Grain 3 Placed (Overlapping) -->
        <g transform="translate(125, 10)"> <!-- High Density Overlap -->
            <use href="#grainWindow" stroke="#22c55e" fill="#22c55e" fill-opacity="0.1"/>
            <path d="M 0 40 Q 25 20, 50 40" fill="none" stroke="#22c55e" stroke-width="2"/>
        </g>

        <!-- Grain 2 Placed (Overlapping) -->
        <g transform="translate(150, 10)">
            <use href="#grainWindow" stroke="#e879f9" fill="#e879f9" fill-opacity="0.1"/>
            <path d="M 0 40 Q 25 20, 50 40" fill="none" stroke="#e879f9" stroke-width="2"/>
        </g>
        
        <!-- More implied grains -->
        <path d="M 175 50 Q 200 30, 225 50" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>
        <path d="M 200 50 Q 225 30, 250 50" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>

        <!-- Resulting Envelope (Sum) -->
        <path d="M 100 50 Q 125 10, 150 20 Q 175 10, 200 50" fill="none" stroke="#f1f5f9" stroke-width="2" filter="url(#glow)"/>
        <text x="220" y="30" fill="#f1f5f9" font-size="12" font-weight="bold">Continuous Texture</text>

        <!-- Phase Coherence Indicator -->
        <g transform="translate(125, 80)">
             <path d="M 0 0 L 100 0" stroke="#f59e0b" stroke-width="1"/>
             <rect x="40" y="-10" width="20" height="20" rx="2" fill="#1e293b" stroke="#f59e0b"/>
             <text x="50" y="4" fill="#f59e0b" font-size="12" text-anchor="middle">φ</text>
             <text x="50" y="25" fill="#94a3b8" font-size="10" text-anchor="middle">Locked</text>
        </g>
    </g>


    <!-- ============================================================================================== -->
    <!-- LEGEND BOX -->
    <!-- ============================================================================================== -->
    <g transform="translate(500, 480)">
        <rect x="0" y="0" width="240" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#e879f9" font-size="12" font-weight="bold">What is Granular Synthesis?</text>
        <text x="20" y="45" fill="#94a3b8" font-size="10">• Breaking sound into tiny "grains".</text>
        <text x="20" y="60" fill="#94a3b8" font-size="10">• Reassembling them to create new</text>
        <text x="20" y="75" fill="#94a3b8" font-size="10">  timbres or clouds.</text>
        <text x="20" y="90" fill="#22c55e" font-size="10" font-weight="bold">→ Our method removes "clicks".</text>
    </g>

</svg>
