<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- Grid Pattern -->
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0f172a" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Frequency Bin &amp; Complex Number</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Each frequency component is represented as a vector on the complex plane.</text-->


    <!-- ============================================================================================== -->
    <!-- LEFT PANEL: FREQUENCY DOMAIN SPECTRUM -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 120)">
        <text x="0" y="-15" fill="#38bdf8" font-size="16" font-weight="bold">1. Frequency Domain (Spectrum)</text>
        
        <!-- Axes -->
        <line x1="0" y1="150" x2="250" y2="150" stroke="#f1f5f9" stroke-width="1"/> <!-- X Axis -->
        <line x1="0" y1="150" x2="0" y2="0" stroke="#f1f5f9" stroke-width="1"/>   <!-- Y Axis -->
        <text x="240" y="170" fill="#94a3b8" font-size="12">Frequency k</text>
        <text x="-10" y="10" fill="#94a3b8" font-size="12" text-anchor="end" writing-mode="tb">Amplitude |X|</text>

        <!-- Spectrum Bars -->
        <rect x="10" y="120" width="15" height="30" fill="#38bdf8" opacity="0.5"/>
        <rect x="30" y="80" width="15" height="70" fill="#38bdf8" opacity="0.5"/>
        <rect x="50" y="100" width="15" height="50" fill="#38bdf8" opacity="0.5"/>
        
        <!-- Highlighted Bin (k-th) -->
        <rect x="70" y="40" width="15" height="110" fill="#f59e0b" stroke="#f1f5f9" stroke-width="2"/>
        <text x="77" y="170" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">k</text>

        <rect x="90" y="90" width="15" height="60" fill="#38bdf8" opacity="0.5"/>
        <rect x="110" y="130" width="15" height="20" fill="#38bdf8" opacity="0.5"/>
        <rect x="130" y="140" width="15" height="10" fill="#38bdf8" opacity="0.5"/>

        <!-- Connection Lines -->
        <path d="M 85 40 L 350 50" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>
        <path d="M 85 150 L 350 350" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>
    </g>


    <!-- ============================================================================================== -->
    <!-- RIGHT PANEL: COMPLEX PLANE -->
    <!-- ============================================================================================== -->
    <g transform="translate(350, 50)">
        <rect x="0" y="0" width="400" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" fill="#f59e0b" font-size="16" font-weight="bold">2. Complex Plane (Detail of k-th Bin)</text>
        
        <g transform="translate(200, 150)"> <!-- Center Origin -->
            
            <!-- Axes -->
            <line x1="-150" y1="0" x2="150" y2="0" stroke="#64748b" stroke-width="1"/> <!-- Real -->
            <line x1="0" y1="120" x2="0" y2="-120" stroke="#64748b" stroke-width="1"/> <!-- Imaginary -->
            
            <text x="160" y="5" fill="#94a3b8" font-size="12">Real (Re)</text>
            <text x="0" y="-130" fill="#94a3b8" font-size="12" text-anchor="middle">Imaginary (Im)</text>

            <!-- The Vector X[k] -->
            <!-- Let's say vector is at 45 degrees, length 100 -->
            <line x1="0" y1="0" x2="70" y2="-70" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
            
            <!-- Point X[k] -->
            <circle cx="70" cy="-70" r="5" fill="#f1f5f9"/>
            <text x="80" y="-80" fill="#f1f5f9" font-size="16" font-weight="bold">X[k]</text>
            <text x="80" y="-60" fill="#94a3b8" font-size="12">= a + jb</text>

            <!-- Components (Dotted Lines) -->
            <line x1="70" y1="0" x2="70" y2="-70" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
            <line x1="0" y1="-70" x2="70" y2="-70" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2"/>
            
            <text x="70" y="15" fill="#f59e0b" font-size="12" text-anchor="middle">a</text>
            <text x="-15" y="-70" fill="#f59e0b" font-size="12">b</text>


            <!-- 1. AMPLITUDE (Magnitude) -->
            <text x="25" y="-45" fill="#22c55e" font-size="14" font-weight="bold">Amp A</text>
            <line x1="2" y1="-2" x2="68" y2="-68" stroke="#22c55e" stroke-width="1" opacity="0.0"/> <!-- Invisible guide -->


            <!-- 2. PHASE (Angle) -->
            <path d="M 40 0 A 40 40 0 0 0 28 -28" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="50" y="-10" fill="#38bdf8" font-size="14" font-weight="bold">Phase φ</text>

        </g>
    </g>


    <!-- ============================================================================================== -->
    <!-- FORMULA / EXPLANATION BOX -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 370)">
        <rect x="0" y="0" width="710" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        
        <text x="30" y="35" fill="#f1f5f9" font-size="18" font-family="monospace">
            X[k] = 
            <tspan fill="#22c55e" font-weight="bold">A</tspan> · e^(j<tspan fill="#38bdf8" font-weight="bold">φ</tspan>) 
            = 
            <tspan fill="#f59e0b">a</tspan> + j<tspan fill="#f59e0b">b</tspan>
        </text>

        <text x="350" y="25" fill="#94a3b8" font-size="12">
            <tspan fill="#22c55e" font-weight="bold">Amplitude (Magnitude)</tspan>: Vector Length (Distance from Origin)
        </text>
        <text x="350" y="45" fill="#94a3b8" font-size="12">
            <tspan fill="#38bdf8" font-weight="bold">Phase (Angle)</tspan>: Vector Angle (Rotation Offset)
        </text>
    </g>

</svg>
