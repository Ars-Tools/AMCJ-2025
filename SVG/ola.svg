<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <!-- Window Shape A (Orange) -->
        <path id="winA" d="M 0 40 Q 20 0, 40 40" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <!-- Window Shape B (Cyan) -->
        <path id="winB" d="M 0 40 Q 20 0, 40 40" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </defs>

    <!-- Background Grid -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- ========================================== -->
    <!-- 1. ANALYSIS STAGE (Left Side) -->
    <!-- ========================================== -->
    <text x="50" y="40" fill="#94a3b8" font-size="14" font-weight="bold">1. Analysis Stage (Extraction)</text>
    
    <g transform="translate(50, 60)">
        <!-- Container Box -->
        <rect x="0" y="0" width="240" height="120" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
        <text x="120" y="25" fill="#f1f5f9" font-size="14" text-anchor="middle">Input Signal x[n]</text>

        <!-- Waveform -->
        <path d="M 10 70 Q 30 40, 50 70 T 90 70 T 130 70 T 170 70 T 210 70" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>

        <!-- Window A (Analysis) at pos 30 -->
        <g transform="translate(30, 50)">
            <use href="#winA" opacity="0.8"/>
            <text x="20" y="-5" fill="#f59e0b" font-size="10" text-anchor="middle">Frame 1</text>
        </g>

        <!-- Window B (Analysis) at pos 60 (Shift = 30) -->
        <g transform="translate(60, 50)">
            <use href="#winB" opacity="0.8"/>
            <text x="20" y="55" fill="#38bdf8" font-size="10" text-anchor="middle">Frame 2</text>
        </g>

        <!-- Analysis Hop Annotation -->
        <line x1="50" y1="100" x2="80" y2="100" stroke="#f1f5f9" stroke-width="1"/> <!-- Start of A center to Start of B center approx -->
        <line x1="50" y1="95" x2="50" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="80" y1="95" x2="80" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <text x="65" y="115" fill="#f1f5f9" font-size="10" text-anchor="middle">Ha (Small)</text>
    </g>

    <!-- Arrow to Processing -->
    <line x1="290" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- ========================================== -->
    <!-- 2. WINDOWING (Middle) -->
    <!-- ========================================== -->
    <g transform="translate(330, 60)">
        <rect x="0" y="0" width="140" height="120" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
        <text x="70" y="25" fill="#f1f5f9" font-size="12" text-anchor="middle">Extracted Frames</text>
        
        <!-- Extracted Frame A -->
        <g transform="translate(20, 35)">
            <path d="M 0 30 Q 15 0, 30 30" fill="none" stroke="#f59e0b" stroke-width="2"/>
            <path d="M 0 30 Q 15 10, 30 30" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/> <!-- Signal content -->
        </g>

        <!-- Extracted Frame B -->
        <g transform="translate(60, 65)">
            <path d="M 0 30 Q 15 0, 30 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <path d="M 0 30 Q 15 15, 30 30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/> <!-- Signal content -->
        </g>
    </g>

    <!-- Arrow down to Synthesis -->
    <path d="M 400 180 L 400 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- ========================================== -->
    <!-- 3. SYNTHESIS STAGE (Bottom) -->
    <!-- ========================================== -->
    <text x="50" y="220" fill="#94a3b8" font-size="14" font-weight="bold">2. Synthesis Stage (Overlap-Add)</text>

    <g transform="translate(50, 240)">
        <!-- Container Box -->
        <rect x="0" y="0" width="420" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
        <text x="210" y="25" fill="#f1f5f9" font-size="14" text-anchor="middle">Time Shifting &amp; Summation</text>

        <!-- Timeline Axis -->
        <line x1="20" y1="100" x2="400" y2="100" stroke="#475569" stroke-width="1"/>

        <!-- Placed Frame 1 (Orange) at t=50 -->
        <g transform="translate(50, 60)">
            <path d="M 0 40 Q 20 0, 40 40" fill="none" stroke="#f59e0b" stroke-width="2"/>
            <path d="M 0 40 Q 20 20, 40 40" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
            <line x1="20" y1="40" x2="20" y2="60" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
            <text x="20" y="75" fill="#f59e0b" font-size="10" text-anchor="middle">t_s1</text>
        </g>

        <!-- Placed Frame 2 (Cyan) at t=110 (Shift = 60, Double the Ha) -->
        <g transform="translate(110, 60)">
            <path d="M 0 40 Q 20 0, 40 40" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <path d="M 0 40 Q 20 25, 40 40" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
            <line x1="20" y1="40" x2="20" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
            <text x="20" y="75" fill="#38bdf8" font-size="10" text-anchor="middle">t_s2</text>
        </g>

        <!-- Synthesis Hop Annotation -->
        <line x1="70" y1="120" x2="130" y2="120" stroke="#f1f5f9" stroke-width="1"/> <!-- Distance between centers -->
        <line x1="70" y1="115" x2="70" y2="125" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="130" y1="115" x2="130" y2="125" stroke="#f1f5f9" stroke-width="1"/>
        <text x="100" y="135" fill="#f1f5f9" font-size="10" text-anchor="middle">Hs (Large)</text>
        <text x="100" y="145" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">Stretched!</text>

        <!-- Resulting Sum (Approximate visual) -->
        <!-- Just showing the envelopes overlapping -->
    </g>

    <!-- Arrow to Final Output -->
    <line x1="470" y1="315" x2="520" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Final Output Waveform -->
    <g transform="translate(520, 265)">
        <rect x="0" y="0" width="180" height="100" rx="6" fill="#334155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="90" y="25" fill="#f1f5f9" font-size="14" text-anchor="middle">Output Signal</text>
        <text x="90" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Elongated Waveform</text>
        
        <!-- Stretched wave -->
        <path d="M 20 50 Q 50 20, 80 50 T 140 50" fill="none" stroke="#f1f5f9" stroke-width="2"/>
    </g>

    <!-- Legend / Context -->
    <g transform="translate(520, 60)">
        <rect x="0" y="0" width="200" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Time Stretch Logic</text>
        
        <circle cx="20" cy="50" r="4" fill="#f59e0b"/>
        <text x="35" y="55" fill="#94a3b8" font-size="10">Frame 1 (Start)</text>
        
        <circle cx="20" cy="70" r="4" fill="#38bdf8"/>
        <text x="35" y="75" fill="#94a3b8" font-size="10">Frame 2 (Shifted)</text>

        <text x="20" y="90" fill="#f1f5f9" font-size="10" font-family="monospace">Hs > Ha → Stretch</text>
    </g>

</svg>
