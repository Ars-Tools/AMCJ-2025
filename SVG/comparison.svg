<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Main Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Speed Change vs. Time Stretch</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Comparison of time modification methods</text-->


    <!-- ========================================== -->
    <!-- SECTION 1: Resampling (Speed Change) -->
    <!-- ========================================== -->
    <g transform="translate(0, 100)">
        <!-- Section Label -->
        <rect x="20" y="0" width="760" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.5"/>
        <text x="40" y="30" fill="#f59e0b" font-size="16" font-weight="bold">Method A: Resampling (Simple Speed Change)</text>
        <text x="40" y="50" fill="#94a3b8" font-size="12">Slowing down playback stretches the waveform, lowering the pitch.</text>

        <!-- A1: Original Signal -->
        <g transform="translate(40, 80)">
            <text x="0" y="-10" fill="#38bdf8" font-size="12" font-weight="bold">Original</text>
            <line x1="0" y1="50" x2="200" y2="50" stroke="#475569" stroke-width="1"/>
            <!-- Waveform: 4 cycles in 200px (Wavelength ~50px) -->
            <path d="M 0 50 Q 12.5 0, 25 50 T 50 50 T 75 50 T 100 50 T 125 50 T 150 50 T 175 50 T 200 50" 
                  fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="100" y="80" fill="#f1f5f9" font-size="10" text-anchor="middle">Time: T</text>
            <text x="100" y="95" fill="#38bdf8" font-size="10" text-anchor="middle">Pitch: High</text>
        </g>

        <!-- Transformation Arrow -->
        <g transform="translate(260, 130)">
            <path d="M 0 0 L 60 0" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
            <text x="30" y="-10" fill="#f59e0b" font-size="10" text-anchor="middle">0.5x Speed</text>
        </g>

        <!-- A2: Resampled Result -->
        <g transform="translate(350, 80)">
            <text x="0" y="-10" fill="#f59e0b" font-size="12" font-weight="bold">Result</text>
            <line x1="0" y1="50" x2="400" y2="50" stroke="#475569" stroke-width="1"/>
            <!-- Waveform: 4 cycles in 400px (Wavelength ~100px) -> LOWER PITCH -->
            <path d="M 0 50 Q 25 0, 50 50 T 100 50 T 150 50 T 200 50 T 250 50 T 300 50 T 350 50 T 400 50" 
                  fill="none" stroke="#f59e0b" stroke-width="2"/>
            <text x="200" y="80" fill="#f1f5f9" font-size="10" text-anchor="middle">Time: 2T (Longer)</text>
            <text x="200" y="95" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Pitch: Low (Changed)</text>
        </g>
    </g>


    <!-- ========================================== -->
    <!-- SECTION 2: Time Stretch (OLA/PV) -->
    <!-- ========================================== -->
    <g transform="translate(0, 320)">
        <!-- Section Label -->
        <rect x="20" y="0" width="760" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.5"/>
        <text x="40" y="30" fill="#22c55e" font-size="16" font-weight="bold">Method B: Time Stretch (OLA / Phase Vocoder)</text>
        <text x="40" y="50" fill="#94a3b8" font-size="12">Signal length is extended, but frequency content (pitch) is preserved.</text>

        <!-- B1: Original Signal (Copy) -->
        <g transform="translate(40, 80)">
            <text x="0" y="-10" fill="#38bdf8" font-size="12" font-weight="bold">Original</text>
            <line x1="0" y1="50" x2="200" y2="50" stroke="#475569" stroke-width="1"/>
            <!-- Waveform: 4 cycles in 200px (Wavelength ~50px) -->
            <path d="M 0 50 Q 12.5 0, 25 50 T 50 50 T 75 50 T 100 50 T 125 50 T 150 50 T 175 50 T 200 50" 
                  fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="100" y="80" fill="#f1f5f9" font-size="10" text-anchor="middle">Time: T</text>
            <text x="100" y="95" fill="#38bdf8" font-size="10" text-anchor="middle">Pitch: High</text>
        </g>

        <!-- Transformation Arrow -->
        <g transform="translate(260, 130)">
            <path d="M 0 0 L 60 0" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
            <text x="30" y="-10" fill="#22c55e" font-size="10" text-anchor="middle">Stretch 200%</text>
        </g>

        <!-- B2: Time Stretched Result -->
        <g transform="translate(350, 80)">
            <text x="0" y="-10" fill="#22c55e" font-size="12" font-weight="bold">Result</text>
            <line x1="0" y1="50" x2="400" y2="50" stroke="#475569" stroke-width="1"/>
            
            <!-- Waveform: 8 cycles in 400px (Wavelength ~50px) -> SAME PITCH -->
            <!-- We preserve the original wavelength but fill double the space -->
            <path d="M 0 50 
                     Q 12.5 0, 25 50 T 50 50 T 75 50 T 100 50 
                     T 125 50 T 150 50 T 175 50 T 200 50
                     T 225 50 T 250 50 T 275 50 T 300 50
                     T 325 50 T 350 50 T 375 50 T 400 50" 
                  fill="none" stroke="#22c55e" stroke-width="2"/>
            
            <text x="200" y="80" fill="#f1f5f9" font-size="10" text-anchor="middle">Time: 2T (Longer)</text>
            <text x="200" y="95" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle">Pitch: High (Preserved!)</text>
        </g>
    </g>


    <!-- ========================================== -->
    <!-- SUMMARY / COMPARISON -->
    <!-- ========================================== -->
    <g transform="translate(40, 540)">
        <rect x="0" y="0" width="720" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        
        <g transform="translate(40, 25)">
            <text x="0" y="0" fill="#f59e0b" font-size="12" font-weight="bold">Resampling</text>
            <text x="0" y="20" fill="#94a3b8" font-size="11">Time ↑ = Pitch ↓</text>
            <text x="0" y="35" fill="#94a3b8" font-size="11">Like slowing down a vinyl record.</text>
        </g>

        <line x1="240" y1="10" x2="240" y2="70" stroke="#334155" stroke-width="1"/>

        <g transform="translate(280, 25)">
            <text x="0" y="0" fill="#22c55e" font-size="12" font-weight="bold">Time Stretch</text>
            <text x="0" y="20" fill="#94a3b8" font-size="11">Time ↑ = Pitch ➔ (Unchanged)</text>
            <text x="0" y="35" fill="#94a3b8" font-size="11">Uses algorithms (OLA, PV) to repeat grains.</text>
        </g>

        <!-- Visual Icon Comparison -->
        <g transform="translate(550, 40)">
             <!-- Tape slow icon -->
             <circle cx="0" cy="0" r="15" fill="none" stroke="#f59e0b" stroke-width="2"/>
             <path d="M -5 -5 L -5 5 L 5 0 Z" fill="#f59e0b"/> 
             
             <text x="30" y="5" fill="#94a3b8" font-size="14">≠</text>

             <!-- Stretch icon -->
             <rect x="50" y="-10" width="30" height="20" fill="none" stroke="#22c55e" stroke-width="2"/>
             <path d="M 55 0 L 75 0" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
        </g>
    </g>

</svg>
