<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrowhead-large" markerWidth="15" markerHeight="15" refX="10" refY="5" orient="auto">
            <polygon points="0 0, 15 5, 0 10" fill="#ef4444" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Window Shape -->
        <path id="windowPath" d="M 0 30 Q 20 0, 40 30" fill="none" stroke-width="2"/>
    </defs>

    <!-- Background -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Main Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Reverse Analysis / Forward Synthesis</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Scanning input backwards (Future → Past) while synthesizing forwards.</text-->


    <!-- ============================================================================================== -->
    <!-- STAGE 1: INPUT ANALYSIS (REVERSE SCAN) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 120)">
        <text x="0" y="-20" fill="#38bdf8" font-size="16" font-weight="bold">1. Input Signal (Reverse Scan)</text>
        
        <!-- Timeline Axis -->
        <line x1="0" y1="40" x2="700" y2="40" stroke="#475569" stroke-width="1"/>
        <text x="10" y="60" fill="#64748b" font-size="10">Past</text>
        <text x="660" y="60" fill="#64748b" font-size="10">Future</text>

        <!-- Waveform -->
        <path d="M 0 40 Q 20 10, 40 40 T 80 40 T 120 40 T 160 40 T 200 40 T 240 40 T 280 40 
                 T 320 40 T 360 40 T 400 40 T 440 40 T 480 40 T 520 40 T 560 40 T 600 40 T 640 40 T 680 40" 
              fill="none" stroke="#334155" stroke-width="1"/>

        <!-- SCAN DIRECTION ARROW (Big Red Arrow Left) -->
        <path d="M 600 -10 L 100 -10" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowhead-large)"/>
        <text x="350" y="-20" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">Analysis Direction (Time Backwards)</text>

        <!-- FRAME 1 (First Step, but at Future Time) -->
        <g transform="translate(550, 10)">
            <use href="#windowPath" stroke="#38bdf8"/>
            <text x="20" y="-5" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Step 1</text>
            <text x="20" y="55" fill="#38bdf8" font-size="10" text-anchor="middle">Time: T_future</text>
            <circle cx="20" cy="55" r="30" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        </g>

        <!-- FRAME 2 (Second Step, at Past Time) -->
        <g transform="translate(150, 10)">
            <use href="#windowPath" stroke="#e879f9"/>
            <text x="20" y="-5" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">Step 2</text>
            <text x="20" y="55" fill="#e879f9" font-size="10" text-anchor="middle">Time: T_past</text>
            <circle cx="20" cy="55" r="30" fill="none" stroke="#e879f9" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        </g>
        
        <!-- Jump path visualization -->
        <path d="M 530 25 Q 350 100, 190 25" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrowhead)"/>
    </g>


    <!-- ============================================================================================== -->
    <!-- STAGE 2: PROCESSING (AMPLITUDE + PHASE LOGIC) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 250)">
        
        <!-- Extracted Amplitudes -->
        <g transform="translate(100, 0)">
            <rect x="0" y="0" width="80" height="60" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="40" y="25" fill="#f1f5f9" font-size="12" text-anchor="middle">|X_step1|</text>
            <text x="40" y="45" fill="#38bdf8" font-size="10" text-anchor="middle">(Future Content)</text>
        </g>

        <g transform="translate(250, 0)">
            <rect x="0" y="0" width="80" height="60" rx="4" fill="#1e293b" stroke="#e879f9" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="40" y="25" fill="#f1f5f9" font-size="12" text-anchor="middle">|X_step2|</text>
            <text x="40" y="45" fill="#e879f9" font-size="10" text-anchor="middle">(Past Content)</text>
        </g>
        
        <!-- Arrows connecting Input to Processing -->
        <path d="M 550 -50 L 140 0" stroke="#38bdf8" stroke-width="1" opacity="0.5" marker-end="url(#arrowhead)"/>
        <path d="M 170 -50 L 290 0" stroke="#e879f9" stroke-width="1" opacity="0.5" marker-end="url(#arrowhead)"/>
    </g>


    <!-- ============================================================================================== -->
    <!-- STAGE 3: OUTPUT SYNTHESIS (FORWARD FLOW) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 400)">
        <text x="0" y="-20" fill="#22c55e" font-size="16" font-weight="bold">2. Output Synthesis (Forward Flow)</text>
        <text x="350" y="-20" fill="#94a3b8" font-size="12">Signal flows naturally 1 → 2, creating smooth reverse audio.</text>

        <!-- Timeline Axis -->
        <line x1="0" y1="40" x2="600" y2="40" stroke="#475569" stroke-width="1"/>
        <text x="580" y="60" fill="#64748b" font-size="10">Time</text>

        <!-- STEP 1 SYNTHESIS (Cyan) -->
        <g transform="translate(50, 10)">
            <use href="#windowPath" stroke="#38bdf8" opacity="0.8"/>
            <path d="M 0 30 Q 20 10, 40 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="20" y="60" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Out 1</text>
        </g>

        <!-- STEP 2 SYNTHESIS (Pink) - Attached to End of 1 -->
        <g transform="translate(80, 10)"> <!-- Hop is small -->
            <use href="#windowPath" stroke="#e879f9" opacity="0.8"/>
            <path d="M 0 30 Q 20 10, 40 30" fill="none" stroke="#e879f9" stroke-width="2"/>
            <text x="20" y="60" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">Out 2</text>
        </g>
        
        <!-- Resulting Waveform Highlight -->
        <path d="M 50 40 Q 60 20, 70 40 T 90 40 T 110 40" fill="none" stroke="#f1f5f9" stroke-width="2" filter="url(#glow)"/>

    </g>


    <!-- ============================================================================================== -->
    <!-- PHASE LOCKING MECHANISM (Crucial Link) -->
    <!-- ============================================================================================== -->
    <g transform="translate(180, 340)">
        <!-- Phase Logic Box -->
        <rect x="0" y="0" width="180" height="40" rx="10" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
        <text x="90" y="25" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Phase Feedback Logic</text>

        <!-- Arrow from Out 1 to Logic -->
        <path d="M -80 75 L -80 20 L 0 20" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
        <text x="-85" y="50" fill="#f59e0b" font-size="10" text-anchor="end">Phase from Out 1</text>

        <!-- Arrow from Logic to Out 2 -->
        <path d="M 180 20 L 260 20 L 260 75" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
        <text x="265" y="50" fill="#f59e0b" font-size="10" text-anchor="start">Apply to Out 2</text>
    </g>


    <!-- ============================================================================================== -->
    <!-- LEGEND / EXPLANATION -->
    <!-- ============================================================================================== -->
    <g transform="translate(450, 450)">
        <rect x="0" y="0" width="300" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#ef4444" font-size="12" font-weight="bold">Smooth "Reverse" Effect</text>
        
        <text x="20" y="45" fill="#f1f5f9" font-size="11">Usually, reverse playback cuts waveforms,</text>
        <text x="20" y="60" fill="#f1f5f9" font-size="11">causing "click" noises at boundaries.</text>
        
        <line x1="20" y1="70" x2="280" y2="70" stroke="#334155" stroke-width="1"/>
        
        <text x="20" y="85" fill="#94a3b8" font-size="11">Here, <tspan fill="#38bdf8" font-weight="bold">Content</tspan> goes Future → Past,</text>
        <text x="20" y="100" fill="#94a3b8" font-size="11">but <tspan fill="#f59e0b" font-weight="bold">Phase</tspan> flows continuously forward.</text>
    </g>

</svg>
