<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Window Shape -->
        <path id="windowPath" d="M 0 30 Q 20 0, 40 30" fill="none" stroke-width="2"/>
    </defs>

    <!-- Background -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="30" y="40" fill="#f1f5f9" font-size="20" font-weight="bold">Discontinuous Analysis / Continuous Synthesis</text-->
    <!--text x="30" y="65" fill="#94a3b8" font-size="12">Stitching skipped time segments smoothly using Phase Feedback.</text-->

    <!-- ========================================== -->
    <!-- 1. INPUT TIMELINE (Top) - Discontinuous -->
    <!-- ========================================== -->
    <g transform="translate(30, 100)">
        <text x="0" y="-10" fill="#38bdf8" font-size="14" font-weight="bold">1. Input Signal (Analysis)</text>
        <text x="250" y="-10" fill="#94a3b8" font-size="12">Analysis Hop (Ha) is large/random</text>

        <!-- Timeline Axis -->
        <line x1="0" y1="40" x2="700" y2="40" stroke="#475569" stroke-width="1"/>
        <text x="680" y="60" fill="#64748b" font-size="10">Time t</text>

        <!-- Waveform (Long) -->
        <path d="M 0 40 Q 20 10, 40 40 T 80 40 T 120 40 T 160 40 T 200 40 T 240 40 T 280 40 
                 T 320 40 T 360 40 T 400 40 T 440 40 T 480 40 T 520 40 T 560 40 T 600 40" 
              fill="none" stroke="#334155" stroke-width="1"/>

        <!-- Selection 1 (Frame k) -->
        <g transform="translate(50, 10)">
            <use href="#windowPath" stroke="#38bdf8"/>
            <text x="20" y="-5" fill="#38bdf8" font-size="12" text-anchor="middle">Frame k</text>
            <text x="20" y="55" fill="#38bdf8" font-size="10" text-anchor="middle">t_k</text>
            <!-- Highlight wave segment -->
            <path d="M 0 30 Q 20 0, 40 30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
        </g>

        <!-- SKIP INDICATION -->
        <text x="220" y="30" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">Large Skip / Jump</text>
        <path d="M 120 40 Q 220 0, 320 40" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrowhead)"/>

        <!-- Selection 2 (Frame k+1) - Far away -->
        <g transform="translate(350, 10)">
            <use href="#windowPath" stroke="#e879f9"/>
            <text x="20" y="-5" fill="#e879f9" font-size="12" text-anchor="middle">Frame k+1</text>
            <text x="20" y="55" fill="#e879f9" font-size="10" text-anchor="middle">t_{k+1}</text>
            <!-- Highlight wave segment -->
            <path d="M 0 30 Q 20 0, 40 30" fill="none" stroke="#e879f9" stroke-width="2" opacity="0.5"/>
        </g>
    </g>

    <!-- Arrows down to Processing -->
    <line x1="100" y1="180" x2="100" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="180" x2="400" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>


    <!-- ========================================== -->
    <!-- 2. SPECTRAL EXTRACTION (Middle) -->
    <!-- ========================================== -->
    <g transform="translate(30, 220)">
        <!-- Extract k -->
        <g transform="translate(50, 0)">
            <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="40" y="30" fill="#f1f5f9" font-size="12" text-anchor="middle">|X_k|</text>
            <text x="40" y="45" fill="#38bdf8" font-size="8" text-anchor="middle">Amplitude</text>
        </g>

        <!-- Extract k+1 -->
        <g transform="translate(310, 0)">
            <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#e879f9" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="40" y="30" fill="#f1f5f9" font-size="12" text-anchor="middle">|X_{k+1}|</text>
            <text x="40" y="45" fill="#e879f9" font-size="8" text-anchor="middle">Amplitude</text>
        </g>
    </g>


    <!-- ========================================== -->
    <!-- 3. OUTPUT SYNTHESIS (Bottom) - Continuous -->
    <!-- ========================================== -->
    <g transform="translate(30, 350)">
        <text x="0" y="-10" fill="#22c55e" font-size="14" font-weight="bold">3. Output Synthesis (Continuous)</text>
        <text x="300" y="-10" fill="#94a3b8" font-size="12">Synthesis Hop (Hs) is constant/small</text>

        <!-- Output Timeline Axis -->
        <line x1="0" y1="40" x2="600" y2="40" stroke="#475569" stroke-width="1"/>
        <text x="580" y="60" fill="#64748b" font-size="10">Time u</text>

        <!-- Output Buffer Box -->
        <rect x="0" y="10" width="550" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

        <!-- Synthesized Frame k -->
        <g transform="translate(50, 25)">
            <use href="#windowPath" stroke="#38bdf8" opacity="0.7"/>
            <path d="M 0 30 Q 20 10, 40 30" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="20" y="60" fill="#38bdf8" font-size="10" text-anchor="middle">Out k</text>
        </g>

        <!-- Synthesized Frame k+1 (Next to k) -->
        <g transform="translate(80, 25)"> <!-- Hop is 30, so placed closely -->
            <use href="#windowPath" stroke="#e879f9" opacity="0.7"/>
            <path d="M 0 30 Q 20 10, 40 30" fill="none" stroke="#e879f9" stroke-width="2"/>
            <text x="20" y="60" fill="#e879f9" font-size="10" text-anchor="middle">Out k+1</text>
        </g>
        
        <!-- Connection Smoothness -->
        <circle cx="90" cy="40" r="15" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="2 2"/>
        <text x="115" y="15" fill="#22c55e" font-size="10" font-weight="bold">Smooth Join!</text>
    </g>


    <!-- ========================================== -->
    <!-- PHASE FEEDBACK MECHANISM -->
    <!-- ========================================== -->
    <!-- Logic Box -->
    <g transform="translate(150, 285)">
        <rect x="0" y="0" width="160" height="40" rx="10" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
        <text x="80" y="25" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Phase Estimation</text>
    </g>

    <!-- Feedback Arrow from Output k to Logic -->
    <path d="M 100 375 L 120 375 L 120 305 L 150 305" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
    <text x="80" y="340" fill="#f59e0b" font-size="10" transform="rotate(-90 80,340)">Feedback from k</text>

    <!-- Feed-forward to k+1 Synthesis -->
    <path d="M 310 305 L 430 305 L 430 350" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
    <text x="370" y="300" fill="#f59e0b" font-size="10" text-anchor="middle">Apply to Frame k+1</text>
    
    <!-- Connection from Amplitude k+1 to Synthesis -->
    <path d="M 420 270 L 420 350" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="4 2"/>


    <!-- ========================================== -->
    <!-- NOTE / LEGEND -->
    <!-- ========================================== -->
    <g transform="translate(500, 150)">
        <rect x="0" y="0" width="260" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Key Concept</text>
        
        <text x="20" y="45" fill="#94a3b8" font-size="11">Even if input frames are far apart</text>
        <text x="20" y="60" fill="#94a3b8" font-size="11">(e.g., Digest, Granular Synthesis),</text>
        <text x="20" y="80" fill="#f1f5f9" font-size="11">the output phase is derived from</text>
        <text x="20" y="95" fill="#f59e0b" font-size="11" font-weight="bold">the PREVIOUS OUTPUT frame,</text>
        <text x="20" y="110" fill="#22c55e" font-size="11">ensuring perfect continuity.</text>
    </g>

</svg>
