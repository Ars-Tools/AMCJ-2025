<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>

        <!-- Window Shape -->
        <path id="windowBell" d="M 0 40 Q 20 0, 40 40" fill="none" stroke-width="2"/>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0f172a" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Animated STFT Process</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Visualizing the sliding window analysis loop.</text-->


    <!-- ============================================================================================== -->
    <!-- 1. TIME DOMAIN SIGNAL (Left) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 120)">
        <text x="0" y="-15" fill="#38bdf8" font-size="16" font-weight="bold">1. Time Domain</text>
        
        <!-- Axis -->
        <line x1="0" y1="150" x2="250" y2="150" stroke="#475569" stroke-width="1"/>
        <text x="240" y="170" fill="#64748b" font-size="10">Time</text>

        <!-- Signal Waveform -->
        <path d="M 0 150 
                 Q 10 100, 20 150 T 40 150 T 60 150 
                 Q 70 50, 80 150 T 100 150 T 120 150 
                 Q 130 100, 140 150 T 160 150 T 180 150 
                 Q 190 20, 200 150 T 220 150 T 240 150" 
              fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

        <!-- Sliding Window Group -->
        <g>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="200 0" dur="4s" repeatCount="indefinite" />
            
            <!-- The Window Curve -->
            <use href="#windowBell" x="0" y="110" stroke="#f59e0b" stroke-width="2"/>
            <!-- Highlight Box -->
            <rect x="0" y="110" width="40" height="80" fill="#f59e0b" fill-opacity="0.1" stroke="none"/>
            <text x="20" y="105" fill="#f59e0b" font-size="10" text-anchor="middle">Window</text>
        </g>
    </g>


    <!-- ============================================================================================== -->
    <!-- PROCESS ARROW (Center) -->
    <!-- ============================================================================================== -->
    <g transform="translate(310, 180)">
        <path d="M 0 0 L 60 0" stroke="#f1f5f9" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="30" y="-10" fill="#f1f5f9" font-size="12" font-weight="bold" text-anchor="middle">DFT</text>
        
        <!-- Pulsing Effect to show processing -->
        <circle cx="30" cy="0" r="5" fill="#f1f5f9" opacity="0">
            <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
            <animate attributeName="r" values="5;15" dur="0.5s" repeatCount="indefinite"/>
        </circle>
    </g>


    <!-- ============================================================================================== -->
    <!-- 2. FREQUENCY DOMAIN (Middle-Right) - Dynamic Spectrum -->
    <!-- ============================================================================================== -->
    <g transform="translate(400, 100)">
        <text x="0" y="0" fill="#22c55e" font-size="12" font-weight="bold">2. Spectrum (Live)</text>
        
        <!-- Vertical Frequency Axis -->
        <line x1="0" y1="20" x2="0" y2="180" stroke="#475569" stroke-width="1"/>
        <text x="-10" y="30" fill="#64748b" font-size="10" text-anchor="end">Freq</text>

        <!-- Dynamic Bars -->
        <!-- Bar 1 (High Freq) -->
        <rect x="0" y="60" width="0" height="10" fill="#38bdf8" opacity="0.5">
            <animate attributeName="width" values="10;40;10;20;10" dur="4s" repeatCount="indefinite"/>
        </rect>
        
        <!-- Bar 2 (Mid Freq) -->
        <rect x="0" y="100" width="0" height="10" fill="#38bdf8" opacity="0.9">
            <animate attributeName="width" values="60;20;80;30;60" dur="4s" repeatCount="indefinite"/>
        </rect>
        
        <!-- Bar 3 (Low Freq) -->
        <rect x="0" y="160" width="0" height="10" fill="#38bdf8" opacity="0.8">
            <animate attributeName="width" values="20;50;10;60;20" dur="4s" repeatCount="indefinite"/>
        </rect>
        
        <text x="70" y="110" fill="#22c55e" font-size="10">X[m, k]</text>
    </g>

    <!-- Mapping Arrow -->
    <path d="M 480 180 L 530 180" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowhead)"/>


    <!-- ============================================================================================== -->
    <!-- 3. TIME-FREQUENCY DOMAIN (Right) - Spectrogram -->
    <!-- ============================================================================================== -->
    <g transform="translate(550, 120)">
        <text x="0" y="-15" fill="#e879f9" font-size="16" font-weight="bold">3. Spectrogram</text>

        <!-- Spectrogram Box -->
        <rect x="0" y="0" width="200" height="160" fill="#1e293b" stroke="#f1f5f9" stroke-width="2"/>
        
        <!-- Axes Labels -->
        <text x="180" y="175" fill="#f1f5f9" font-size="10">Time</text>
        <text x="-10" y="20" fill="#f1f5f9" font-size="10" text-anchor="end">Freq</text>
        
        <!-- Spectrogram Content (Static Background for context) -->
        <rect x="5" y="80" width="190" height="15" fill="#38bdf8" opacity="0.3"/>
        <rect x="5" y="140" width="190" height="15" fill="#38bdf8" opacity="0.2"/>
        
        <!-- Scanning Highlight Line (Synchronized with Window) -->
        <g>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="180 0" dur="4s" repeatCount="indefinite" />
            
            <!-- Current Column Highlight -->
            <rect x="5" y="2" width="15" height="156" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
            
            <!-- Dynamic "Ink" appearing at the scan line (Simulated) -->
            <!-- High Freq Bar -->
            <rect x="5" y="60" width="15" height="15" fill="#38bdf8" opacity="0.5">
                 <animate attributeName="opacity" values="0.2;0.8;0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
            </rect>
            <!-- Mid Freq Bar -->
            <rect x="5" y="100" width="15" height="15" fill="#38bdf8" opacity="0.9">
                 <animate attributeName="opacity" values="0.9;0.3;0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
            </rect>
            <!-- Low Freq Bar -->
            <rect x="5" y="160" width="15" height="15" fill="#38bdf8" opacity="0.8">
                 <animate attributeName="opacity" values="0.3;0.7;0.2;0.8;0.3" dur="4s" repeatCount="indefinite"/>
            </rect>
            
            <text x="12" y="-5" fill="#f59e0b" font-size="10" text-anchor="middle">m</text>
        </g>

    </g>


    <!-- ============================================================================================== -->
    <!-- EXPLANATION BOX -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 380)">
        <rect x="0" y="0" width="710" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        
        <text x="20" y="25" fill="#f1f5f9" font-size="14" font-weight="bold">Animation Logic</text>
        <text x="20" y="45" fill="#94a3b8" font-size="12">1. <tspan fill="#f59e0b" font-weight="bold">Window Slides:</tspan> Extracts signal at current time (t).</text>
        <text x="20" y="65" fill="#94a3b8" font-size="12">2. <tspan fill="#22c55e" font-weight="bold">FFT Updates:</tspan> Spectrum changes based on window content.</text>
        <text x="350" y="45" fill="#94a3b8" font-size="12">3. <tspan fill="#e879f9" font-weight="bold">Spectrogram Builds:</tspan> Current spectrum is painted as a vertical column.</text>
    </g>

</svg>
