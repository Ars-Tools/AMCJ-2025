<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Grid Pattern -->
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
        <!-- Window Shape -->
        <path id="windowRect" d="M 0 0 L 120 0 L 120 80 L 0 80 Z" fill="none" stroke-width="2"/>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="24" font-weight="bold">Cutting Position Determines Phase</text-->
    <!--text x="40" y="70" fill="#94a3b8" font-size="14">Shifting the analysis window changes the "start shape" of the waveform inside.</text-->

    <!-- ============================================================================================== -->
    <!-- 1. GLOBAL CONTEXT (Top) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 120)">
        <text x="0" y="-20" fill="#f1f5f9" font-size="16" font-weight="bold">1. Global Signal (Continuous)</text>
        <text x="300" y="-20" fill="#94a3b8" font-size="12">An infinite sine wave exists.</text>
        
        <!-- Axis -->
        <line x1="0" y1="50" x2="700" y2="50" stroke="#475569" stroke-width="1"/>
        
        <!-- Continuous Sine Wave (Corrected Amplitude) -->
        <!-- Adjusted control points to y=-50 to reach peak y=0 (Amplitude 50) -->
        <path d="M 0 50 Q 25 -50, 50 50 T 100 50 T 150 50 T 200 50 T 250 50 T 300 50 
                 T 350 50 T 400 50 T 450 50 T 500 50 T 550 50 T 600 50 T 650 50 T 700 50" 
              fill="none" stroke="#64748b" stroke-width="2" opacity="0.5"/>
        
        <!-- Position A (Blue) - At Zero Crossing -->
        <g transform="translate(100, 10)">
            <rect x="0" y="0" width="100" height="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="50" y="-5" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Position A</text>
            <!-- Highlight Wave (Corrected Amplitude) -->
            <!-- Center y=40. Control Point y=-60. Peak y=-10. Amplitude 50. -->
            <path d="M 0 40 Q 25 -60, 50 40 T 100 40" fill="none" stroke="#38bdf8" stroke-width="3"/>
        </g>

        <!-- Position B (Orange) - At Peak (Shifted) -->
        <g transform="translate(325, 10)">
            <rect x="0" y="0" width="100" height="80" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="50" y="-5" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">Position B</text>
            <!-- Highlight Wave (Starts at Peak) -->
            <path d="M 0 -10 Q 12.5 -10, 25 40 T 50 90 T 75 40 T 100 -10" fill="none" stroke="#f59e0b" stroke-width="3"/>
        </g>

        <!-- Shift Arrow -->
        <path d="M 205 50 L 320 50" stroke="#f1f5f9" stroke-width="1" marker-end="url(#arrowhead)"/>
        <text x="260" y="45" fill="#f1f5f9" font-size="10" text-anchor="middle">Shift</text>
    </g>


    <!-- ============================================================================================== -->
    <!-- 2. EXTRACTED FRAMES (Middle) -->
    <!-- ============================================================================================== -->
    <g transform="translate(40, 260)">
        <text x="0" y="-20" fill="#f1f5f9" font-size="16" font-weight="bold">2. Extracted Frames (Local View)</text>
        <text x="300" y="-20" fill="#94a3b8" font-size="12">What the waveform looks like inside each frame.</text>

        <!-- Frame A Result -->
        <g transform="translate(50, 20)">
            <rect x="0" y="0" width="150" height="100" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <text x="10" y="20" fill="#38bdf8" font-size="12" font-weight="bold">Frame A</text>
            <line x1="0" y1="50" x2="150" y2="50" stroke="#334155" stroke-width="1"/>
            
            <!-- Wave starts at 0 (Corrected Amplitude) -->
            <!-- Center y=50. Control Point y=-50. Peak y=0. Amplitude 50. -->
            <path d="M 0 50 Q 37.5 -50, 75 50 T 150 50" fill="none" stroke="#38bdf8" stroke-width="3"/>
            
            <circle cx="0" cy="50" r="4" fill="#38bdf8"/>
            <text x="10" y="90" fill="#38bdf8" font-size="10">Starts at 0 (Sine-like)</text>
        </g>

        <!-- Frame B Result -->
        <g transform="translate(350, 20)">
            <rect x="0" y="0" width="150" height="100" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <text x="10" y="20" fill="#f59e0b" font-size="12" font-weight="bold">Frame B</text>
            <line x1="0" y1="50" x2="150" y2="50" stroke="#334155" stroke-width="1"/>
            
            <!-- Wave starts at Peak (Shifted Sine) -->
            <path d="M 0 0 Q 18.75 0, 37.5 50 T 75 100 T 112.5 50 T 150 0" fill="none" stroke="#f59e0b" stroke-width="3"/>
            
            <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
            <text x="10" y="90" fill="#f59e0b" font-size="10">Starts at Peak (Cosine-like)</text>
        </g>
    </g>


    <!-- ============================================================================================== -->
    <!-- 3. COMPARISON (Bottom) -->
    <!-- ============================================================================================== -->
    <g transform="translate(580, 260)">
        <rect x="0" y="20" width="180" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="10" y="40" fill="#f1f5f9" font-size="12" font-weight="bold">Comparison</text>
        
        <g transform="translate(15, 70)">
            <!-- Overlay A (Corrected Amplitude) -->
            <!-- Center y=25. Control Point y=-75. Peak y=-25. Amplitude 50. -->
            <path d="M 0 25 Q 37.5 -75, 75 25 T 150 25" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
            <!-- Overlay B -->
            <path d="M 0 -25 Q 18.75 -25, 37.5 25 T 75 75 T 112.5 25 T 150 -25" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
            
            <!-- Phase Difference Arrow -->
            <path d="M 0 25 L 18 25" stroke="#f1f5f9" stroke-width="1" marker-end="url(#arrowhead)"/>
            <text x="25" y="30" fill="#f1f5f9" font-size="10">Phase Diff</text>
        </g>
    </g>
    
    <!-- Legend -->
    <g transform="translate(40, 410)">
        <text x="0" y="0" fill="#22c55e" font-size="14" font-weight="bold">Conclusion:</text>
        <text x="0" y="20" fill="#94a3b8" font-size="12">
            Even for the same signal, <tspan fill="#f1f5f9" font-weight="bold">where you cut</tspan> determines the <tspan fill="#f59e0b" font-weight="bold">initial phase</tspan> of the frame.
        </text>
    </g>

</svg>
