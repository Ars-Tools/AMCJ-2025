<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Dashed Line Pattern for grid -->
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="18" font-weight="bold">Simple Speed Change (Resampling)</text-->
    <!--text x="40" y="65" fill="#94a3b8" font-size="12">Stretching time by slowing down playback lowers the pitch.</text-->


    <!-- ========================================== -->
    <!-- SCENARIO 1: Original Signal -->
    <!-- ========================================== -->
    <g transform="translate(40, 100)">
        <text x="0" y="-10" fill="#38bdf8" font-size="14" font-weight="bold">Original Signal</text>
        
        <!-- Axis -->
        <line x1="0" y1="50" x2="200" y2="50" stroke="#475569" stroke-width="1"/>
        
        <!-- Waveform: High Frequency -->
        <!-- 4 cycles in 200px approx -->
        <path d="M 0 50 Q 12.5 0, 25 50 T 50 50 T 75 50 T 100 50 T 125 50 T 150 50 T 175 50 T 200 50" 
              fill="none" stroke="#38bdf8" stroke-width="3"/>
        
        <!-- Duration Marker -->
        <line x1="0" y1="100" x2="200" y2="100" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="0" y1="95" x2="0" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="200" y1="95" x2="200" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <text x="100" y="120" fill="#f1f5f9" font-size="12" text-anchor="middle">Time: T</text>

        <!-- Frequency Marker -->
        <line x1="0" y1="20" x2="50" y2="20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="25" y="15" fill="#38bdf8" font-size="10" text-anchor="middle">Cycle</text>
    </g>


    <!-- ========================================== -->
    <!-- TRANSFORMATION ARROW -->
    <!-- ========================================== -->
    <g transform="translate(280, 150)">
        <path d="M 0 0 L 80 0" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)"/>
        <text x="40" y="-15" fill="#ef4444" font-size="12" text-anchor="middle" font-weight="bold">Play at 0.5x Speed</text>
        <text x="40" y="20" fill="#94a3b8" font-size="10" text-anchor="middle">(No OLA/PV)</text>
    </g>


    <!-- ========================================== -->
    <!-- SCENARIO 2: Stretched Signal (Pitch Drop) -->
    <!-- ========================================== -->
    <g transform="translate(400, 100)">
        <text x="0" y="-10" fill="#f59e0b" font-size="14" font-weight="bold">Stretched Signal</text>
        
        <!-- Axis -->
        <line x1="0" y1="50" x2="350" y2="50" stroke="#475569" stroke-width="1"/>
        
        <!-- Waveform: Low Frequency (Stretched) -->
        <!-- Same number of cycles (8 half-cycles -> 4 full cycles), but over 400px -->
        <!-- Wait, original was 200px for 4 cycles. Stretched should be 400px for 4 cycles. -->
        <path d="M 0 50 Q 25 0, 50 50 T 100 50 T 150 50 T 200 50 T 250 50 T 300 50 T 350 50 T 400 50" 
              fill="none" stroke="#f59e0b" stroke-width="3"/>
        
        <!-- Duration Marker -->
        <line x1="0" y1="100" x2="400" y2="100" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="0" y1="95" x2="0" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <line x1="400" y1="95" x2="400" y2="105" stroke="#f1f5f9" stroke-width="1"/>
        <text x="200" y="120" fill="#f1f5f9" font-size="12" text-anchor="middle">Time: 2T (Longer)</text>

        <!-- Frequency Marker -->
        <line x1="0" y1="20" x2="100" y2="20" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
        <text x="50" y="15" fill="#f59e0b" font-size="10" text-anchor="middle">Cycle (Wider)</text>
        
        <!-- Pitch Drop Annotation -->
        <text x="200" y="150" fill="#ef4444" font-size="16" font-weight="bold" text-anchor="middle">Pitch Drops!</text>
        <text x="200" y="170" fill="#ef4444" font-size="12" text-anchor="middle">(Low Frequency)</text>
    </g>


    <!-- ========================================== -->
    <!-- COMPARISON BOX -->
    <!-- ========================================== -->
    <g transform="translate(40, 250)">
        <rect x="0" y="0" width="720" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        
        <!-- Analogies -->
        <g transform="translate(40, 20)">
            <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="bold">Original (High Pitch)</text>
            <circle cx="10" cy="30" r="15" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
            <!-- Music Note Icon Small -->
            <path d="M 5 35 L 5 20 L 15 20 L 15 35" stroke="#38bdf8" stroke-width="2" fill="none"/>
            <circle cx="5" cy="35" r="3" fill="#38bdf8"/>
            <circle cx="15" cy="35" r="3" fill="#38bdf8"/>
        </g>
        
        <text x="150" y="55" fill="#94a3b8" font-size="18">→</text>

        <g transform="translate(200, 20)">
            <text x="0" y="0" fill="#f59e0b" font-size="12" font-weight="bold">Resampled (Low Pitch)</text>
            <circle cx="10" cy="30" r="20" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
             <!-- Music Note Icon Big -->
            <path d="M 0 35 L 0 15 L 15 15 L 15 35" stroke="#f59e0b" stroke-width="2" fill="none"/>
            <circle cx="0" cy="35" r="4" fill="#f59e0b"/>
            <circle cx="15" cy="35" r="4" fill="#f59e0b"/>
            <text x="40" y="35" fill="#f59e0b" font-size="10">"Chipmunk Effect" (reversed)</text>
        </g>

        <!-- Text Explanation -->
        <g transform="translate(400, 20)">
            <text x="0" y="10" fill="#f1f5f9" font-size="12" font-weight="bold">Why OLA/PV is needed:</text>
            <path d="M 0 25 L 300 25" stroke="#475569" stroke-width="1"/>
            <text x="0" y="45" fill="#94a3b8" font-size="11">To stretch time <b>without</b> stretching the waveform itself.</text>
            <text x="0" y="65" fill="#94a3b8" font-size="11">(Preserving the frequency content)</text>
        </g>
    </g>

</svg>
