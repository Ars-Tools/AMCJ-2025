<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Spectral Icons -->
        <g id="spectrumIconA"> <!-- Cyan -->
            <rect x="0" y="15" width="4" height="15" fill="#38bdf8"/>
            <rect x="6" y="5" width="4" height="25" fill="#38bdf8"/>
            <rect x="12" y="10" width="4" height="20" fill="#38bdf8"/>
        </g>
        <g id="spectrumIconB"> <!-- Pink -->
            <rect x="0" y="20" width="4" height="10" fill="#e879f9"/>
            <rect x="6" y="15" width="4" height="15" fill="#e879f9"/>
            <rect x="12" y="5" width="4" height="25" fill="#e879f9"/>
        </g>
        <g id="spectrumIconPhase"> <!-- Orange -->
            <rect x="0" y="15" width="4" height="15" fill="#f59e0b"/>
            <rect x="6" y="5" width="4" height="25" fill="#f59e0b"/>
            <rect x="12" y="10" width="4" height="20" fill="#f59e0b"/>
        </g>
    </defs>

    <!-- Background -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="30" y="40" fill="#f1f5f9" font-size="20" font-weight="bold">Cross Synthesis (Spectral Multiplication)</text-->
    <!--text x="30" y="65" fill="#94a3b8" font-size="12">Combining amplitudes of two sources with phase consistency.</text-->
    <!-- ========================================== -->
    <!-- INPUT A (Top Left) -->
    <!-- ========================================== -->
    <text x="30" y="100" fill="#38bdf8" font-size="12" font-weight="bold">Input A (e.g. Voice)</text>
    <g transform="translate(30, 110)">
        <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
        <text x="40" y="30" fill="#f1f5f9" font-size="12" text-anchor="middle">Signal A</text>
    </g>
    <line x1="110" y1="135" x2="130" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <g transform="translate(130, 110)">
        <rect x="0" y="0" width="90" height="50" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1"/>
        <text x="45" y="20" fill="#f1f5f9" font-size="10" text-anchor="middle">FFT</text>
        <text x="45" y="40" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">|A|</text>
    </g>
    <!-- Arrow to Merge -->
    <path d="M 220 135 L 260 135 L 260 180" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)"/>


    <!-- ========================================== -->
    <!-- INPUT B (Middle Left) -->
    <!-- ========================================== -->
    <text x="30" y="190" fill="#e879f9" font-size="12" font-weight="bold">Input B (e.g. Synth)</text>
    <g transform="translate(30, 200)">
        <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#e879f9" stroke-width="2"/>
        <text x="40" y="30" fill="#f1f5f9" font-size="12" text-anchor="middle">Signal B</text>
    </g>
    <line x1="110" y1="225" x2="130" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <g transform="translate(130, 200)">
        <rect x="0" y="0" width="90" height="50" rx="4" fill="#334155" stroke="#e879f9" stroke-width="1"/>
        <text x="45" y="20" fill="#f1f5f9" font-size="10" text-anchor="middle">FFT</text>
        <text x="45" y="40" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">|B|</text>
    </g>
    <!-- Arrow to Merge -->
    <path d="M 220 225 L 260 225 L 260 200" fill="none" stroke="#e879f9" stroke-width="2" marker-end="url(#arrowhead)"/>


    <!-- ========================================== -->
    <!-- AMPLITUDE MERGE (Center) -->
    <!-- ========================================== -->
    <g transform="translate(240, 180)">
        <circle cx="20" cy="10" r="15" fill="#1e293b" stroke="#f1f5f9" stroke-width="2"/>
        <text x="20" y="14" fill="#f1f5f9" font-size="14" font-weight="bold" text-anchor="middle">×</text>
    </g>
    
    <text x="310" y="175" fill="#94a3b8" font-size="10" font-weight="bold">Spectral Multiply</text>
    <text x="310" y="190" fill="#f1f5f9" font-size="12">|New| = |A| · |B|</text>
    
    <!-- Arrow to Synthesis -->
    <path d="M 280 190 L 450 190 L 450 230 L 480 230" fill="none" stroke="#f1f5f9" stroke-width="2" marker-end="url(#arrowhead)"/>


    <!-- ========================================== -->
    <!-- FEEDBACK PHASE (Bottom) -->
    <!-- ========================================== -->
    <text x="30" y="320" fill="#f59e0b" font-size="12" font-weight="bold">Phase Feedback (Output)</text>
    
    <!-- Past Output Box -->
    <g transform="translate(30, 330)">
        <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="40" y="30" fill="#f59e0b" font-size="12" text-anchor="middle">Output[n-1]</text>
    </g>
    <line x1="110" y1="355" x2="130" y2="355" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>

    <!-- FFT for Phase -->
    <g transform="translate(130, 330)">
        <rect x="0" y="0" width="90" height="50" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
        <text x="45" y="20" fill="#f1f5f9" font-size="10" text-anchor="middle">FFT</text>
        <text x="45" y="40" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">∠Y</text>
    </g>
    
    <!-- Arrow to Synthesis -->
    <path d="M 220 355 L 450 355 L 450 270 L 480 270" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead-orange)"/>


    <!-- ========================================== -->
    <!-- SYNTHESIS (Right) -->
    <!-- ========================================== -->
    <text x="480" y="215" fill="#f1f5f9" font-size="12" font-weight="bold">Synthesis Stage</text>
    
    <!-- Combine Node -->
    <g transform="translate(480, 220)">
        <rect x="0" y="0" width="100" height="70" rx="6" fill="#334155" stroke="#f1f5f9" stroke-width="2"/>
        <text x="50" y="25" fill="#f1f5f9" font-size="12" text-anchor="middle">Combine</text>
        <text x="50" y="45" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">|New|</text>
        <text x="50" y="60" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">∠Y</text>
    </g>

    <line x1="580" y1="255" x2="610" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- IFFT & OLA -->
    <g transform="translate(610, 220)">
        <rect x="0" y="0" width="100" height="70" rx="6" fill="#334155" stroke="#22c55e" stroke-width="2"/>
        <text x="50" y="25" fill="#f1f5f9" font-size="12" text-anchor="middle">IFFT &amp; OLA</text>
        <text x="50" y="55" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">Σ</text>
    </g>

    <line x1="710" y1="255" x2="740" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Final Output -->
    <g transform="translate(740, 230)">
        <text x="0" y="0" fill="#22c55e" font-size="12" font-weight="bold">Output</text>
        <path d="M 0 25 Q 20 10, 40 25 T 80 25" fill="none" stroke="#22c55e" stroke-width="2"/>
    </g>


    <!-- ========================================== -->
    <!-- FEEDBACK LOOP LINE -->
    <!-- ========================================== -->
    <path d="M 780 260 L 780 420 L 70 420 L 70 380" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="400" y="435" fill="#f59e0b" font-size="10" text-anchor="middle">Feedback: Output Phase ensures continuity</text>
    <polygon points="70 380, 65 390, 75 390" fill="#f59e0b" />


    <!-- ========================================== -->
    <!-- CONCEPT NOTE -->
    <!-- ========================================== -->
    <g transform="translate(500, 40)">
        <rect x="0" y="0" width="280" height="80" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Cross Synthesis Logic</text>
        <text x="20" y="45" fill="#94a3b8" font-size="11">• Multiplies spectral envelopes.</text>
        <text x="20" y="60" fill="#94a3b8" font-size="11">• E.g., Voice formant (A) x Synth harmonics (B)</text>
        <text x="20" y="75" fill="#f59e0b" font-size="11" font-weight="bold">→ Vocoder Effect with smooth phase.</text>
    </g>

</svg>
