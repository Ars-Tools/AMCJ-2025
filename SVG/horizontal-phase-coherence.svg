<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Noto Sans JP', sans-serif;">
    <!-- Definitions -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Dashed Line Pattern for grid -->
        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#smallGrid)" rx="8" />

    <!-- Title -->
    <!--text x="40" y="40" fill="#f1f5f9" font-size="18" font-weight="bold">Phase Discontinuity in Standard OLA</text-->
    <!--text x="40" y="65" fill="#94a3b8" font-size="12">Without phase compensation, time shifting creates destructive interference.</text-->

    <!-- ========================================== -->
    <!-- SCENARIO: Standard OLA (No Compensation) -->
    <!-- ========================================== -->
    <g transform="translate(40, 100)">
        <rect x="0" y="0" width="720" height="160" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        
        <text x="20" y="30" fill="#f59e0b" font-size="14" font-weight="bold">Standard OLA (No Phase Compensation)</text>
        <text x="20" y="50" fill="#94a3b8" font-size="12">Phase is copied directly. Shifts cause peaks to align with troughs.</text>

        <!-- Visualization Area -->
        <g transform="translate(40, 60)">
            <!-- Frame 1 (Orange) -->
            <path d="M 0 40 Q 15 0, 30 40 T 60 40 T 90 40 T 120 40 T 150 40" 
                  fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
            <text x="0" y="80" fill="#f59e0b" font-size="10" opacity="0.8">Frame 1 (Original Phase)</text>

            <!-- Frame 2 (Shifted, Cyan) - MISALIGNED -->
            <!-- Shifted by Hop Size Hs. If Hs is not integer multiple of period, phase is wrong -->
            <g transform="translate(80, 0)"> 
                <!-- This wave starts at phase 0, but Frame 1 at x=80 is at a peak/trough. -->
                <!-- Simulated cancellation: Frame 1 at x=80 is going UP. Frame 2 starts going DOWN. -->
                <path d="M 0 40 Q 15 80, 30 40 T 60 40 T 90 40 T 120 40 T 150 40" 
                      fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
                <text x="120" y="80" fill="#38bdf8" font-size="10" opacity="0.8">Frame 2 (Shifted)</text>
            </g>

            <!-- Overlap Region Highlight -->
            <rect x="80" y="10" width="70" height="60" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4"/>
            <text x="115" y="25" fill="#ef4444" font-size="10" text-anchor="middle" font-weight="bold">Overlap</text>
            
            <!-- Resulting Sum (Discontinuous) -->
            <g transform="translate(280, 0)">
                <text x="30" y="10" fill="#f1f5f9" font-size="12">Resulting Waveform</text>
                <!-- Frame 1 part -->
                <path d="M 0 40 Q 15 0, 30 40 T 60 40 Q 65 50, 70 40" 
                      fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.5"/>
                
                <!-- Destructive Interference Area -->
                <path d="M 70 40 L 90 40 L 110 40" stroke="#ef4444" stroke-width="3"/>
                
                <!-- Frame 2 part -->
                <path d="M 110 40 Q 125 0, 140 40 T 170 40" 
                      fill="none" stroke="#f1f5f9" stroke-width="2" opacity="0.5"/>
                
                <text x="90" y="60" fill="#ef4444" font-size="10" text-anchor="middle">Cancellation / Phase Jump</text>
                
                <!-- Annotation arrow -->
                <path d="M 90 65 L 90 45" stroke="#ef4444" stroke-width="1" marker-end="url(#arrowhead)"/>
            </g>
        </g>
    </g>

    <!-- Bottom Legend -->
    <g transform="translate(40, 280)">
        <text x="0" y="10" fill="#94a3b8" font-size="12">
            <tspan font-weight="bold" fill="#f59e0b">Horizontal Phase Coherence Loss:</tspan> Waveform continuity is broken at frame boundaries.
        </text>
    </g>

</svg>
